name: Build NullSec Browser

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Mullvad Browser source branch or tag
        required: true
        default: mullvad-browser-153.7.0esr-16.0-1
      target:
        description: Which platform(s) to build
        type: choice
        options:
          - linux64
          - windows64
          - all
        default: linux64
      create_release:
        description: Upload the package as a GitHub release asset
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nullsec-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux64:
    if: inputs.target == 'linux64' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Clone Mullvad Browser source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/mullvad/mullvad-browser.git src
          git -C src log -1 --oneline

      - name: Apply NullSec patches
        run: |
          set -eux
          shopt -s nullglob
          patches=(browser/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No NullSec patches to apply yet."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::apply $p"
            git -C src apply --index -v "$p" || git -C src apply --3way -v "$p"
            echo "::endgroup::"
          done

      - name: Bootstrap build dependencies
        working-directory: src
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: ./mach bootstrap --application-choice browser

      - name: Configure
        working-directory: src
        run: |
          set -eux
          cp ../browser/nullsec-mozconfig mozconfig
          ./mach configure

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          ./mach build 2>&1 | tee ../build.log

      - name: Show build failure
        if: failure()
        run: |
          echo "::group::last 400 lines of build.log"
          tail -n 400 build.log || true
          echo "::endgroup::"
          df -h /

      - name: Package
        working-directory: src
        run: |
          set -o pipefail
          ./mach package 2>&1 | tee -a ../build.log

      - name: Collect package
        run: |
          set -eux
          mkdir -p out
          find src/obj-nullsec/dist -maxdepth 1 -type f \
            \( -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \) \
            -exec cp -v {} out/ \;
          ls -lah out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-linux64
          path: out/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-linux64-log
          path: |
            build.log
            src/obj-nullsec/config.log
          if-no-files-found: ignore

  windows64:
    if: inputs.target == 'windows64' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Clone Mullvad Browser source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/mullvad/mullvad-browser.git src
          git -C src log -1 --oneline

      - name: Apply NullSec patches
        run: |
          set -eux
          shopt -s nullglob
          patches=(browser/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No NullSec patches to apply yet."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::apply $p"
            git -C src apply --index -v "$p" || git -C src apply --3way -v "$p"
            echo "::endgroup::"
          done

      - name: Bootstrap build dependencies
        working-directory: src
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: ./mach bootstrap --application-choice browser

      - name: Install llvm-mingw toolchain
        run: |
          set -eux
          curl -fL --retry 5 -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
          ls "$HOME/llvm-mingw/bin" | grep -E 'mingw32-clang|llvm-ar' || true

      - name: Add Rust Windows target
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain list || true
          rustup target add --toolchain stable-x86_64-unknown-linux-gnu \
            x86_64-pc-windows-gnu x86_64-pc-windows-gnullvm
          rustup target list --toolchain stable-x86_64-unknown-linux-gnu --installed

      - name: Configure
        working-directory: src
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: |
          set -eux
          cp ../browser/nullsec-mozconfig-win64 mozconfig
          ./mach configure

      - name: Build
        working-directory: src
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: |
          set -o pipefail
          ./mach build 2>&1 | tee ../build.log

      - name: Show build failure
        if: failure()
        run: |
          echo "::group::last 400 lines of build.log"
          tail -n 400 build.log || true
          echo "::endgroup::"
          df -h /

      - name: Package
        working-directory: src
        run: |
          set -o pipefail
          ./mach package 2>&1 | tee -a ../build.log

      - name: Collect package
        run: |
          set -eux
          mkdir -p out
          find src/obj-nullsec-win64/dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.xz' -o -name '*.tar.bz2' \) \
            -exec cp -v {} out/ \;
          ls -lah out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-windows64
          path: out/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-windows64-log
          path: |
            build.log
            src/obj-nullsec-win64/config.log
          if-no-files-found: ignore

  release:
    if: ${{ always() && inputs.create_release && (needs.linux64.result == 'success' || needs.windows64.result == 'success') }}
    needs: [linux64, windows64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          tag="nullsec-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          find artifacts -type f | sort
          gh release create "$tag" $(find artifacts -type f) \
            --title "NullSec Browser $tag" \
            --notes "Automated build from Mullvad source ${SOURCE_REF}." \
            --target "$GITHUB_SHA"

name: Build NullSec Browser

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Mullvad Browser source branch or tag
        required: true
        default: mullvad-browser-153.7.0esr-16.0-1
      target:
        description: Which platform(s) to build
        type: choice
        options:
          - linux64
          - windows64
          - all
        default: linux64
      create_release:
        description: Upload the package as a GitHub release asset
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nullsec-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux64:
    if: inputs.target == 'linux64' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Clone Mullvad Browser source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/mullvad/mullvad-browser.git src
          git -C src log -1 --oneline

      - name: Apply NullSec patches
        run: |
          set -eux
          shopt -s nullglob
          patches=(browser/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No NullSec patches to apply yet."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::apply $p"
            git -C src apply --index -v "$p" || git -C src apply --3way -v "$p"
            echo "::endgroup::"
          done

      - name: Bootstrap build dependencies
        working-directory: src
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: ./mach bootstrap --application-choice browser

      - name: Configure
        working-directory: src
        run: |
          set -eux
          cp ../browser/nullsec-mozconfig mozconfig
          ./mach configure

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          ./mach build 2>&1 | tee ../build.log

      - name: Show build failure
        if: failure()
        run: |
          echo "::group::last 400 lines of build.log"
          tail -n 400 build.log || true
          echo "::endgroup::"
          df -h /

      - name: Package
        working-directory: src
        run: |
          set -o pipefail
          ./mach package 2>&1 | tee -a ../build.log

      - name: Collect package
        run: |
          set -eux
          mkdir -p out
          find src/obj-nullsec/dist -maxdepth 1 -type f \
            \( -name '*.tar.xz' -o -name '*.tar.bz2' -o -name '*.zip' \) \
            -exec cp -v {} out/ \;
          ls -lah out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-linux64
          path: out/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-linux64-log
          path: |
            build.log
            src/obj-nullsec/config.log
          if-no-files-found: ignore

  windows64:
    if: inputs.target == 'windows64' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout control repo
        uses: actions/checkout@v4

      - name: Clone Mullvad Browser source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          git clone --depth 1 --branch "$SOURCE_REF" \
            https://github.com/mullvad/mullvad-browser.git src
          git -C src log -1 --oneline

      - name: Apply NullSec patches
        run: |
          set -eux
          shopt -s nullglob
          patches=(browser/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No NullSec patches to apply yet."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "::group::apply $p"
            git -C src apply --index -v "$p" || git -C src apply --3way -v "$p"
            echo "::endgroup::"
          done

      - name: Bootstrap build dependencies
        working-directory: src
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: ./mach bootstrap --application-choice browser

      - name: Ensure cargo tools on PATH
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cbindgen >/dev/null 2>&1; then
            cargo install cbindgen --locked
          fi
          command -v cbindgen
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install llvm-mingw toolchain
        run: |
          set -eux
          curl -fL --retry 5 -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir -p "$HOME/llvm-mingw"
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1
          echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"
          ls "$HOME/llvm-mingw/bin" | grep -E 'mingw32-clang|llvm-ar' || true

      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd nasm unzip

      - name: Install Mozilla Wine
        run: |
          set -eux
          curl -fL --retry 5 -o /tmp/wine.tar.zst \
            https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/GfgAotOKSeu53g0QOJcuIg/artifacts/public/build/wine.tar.zst
          mkdir -p "$HOME/wine"
          tar --zstd -xf /tmp/wine.tar.zst -C "$HOME/wine" --strip-components=1
          find "$HOME/wine" -maxdepth 3 -type f -name 'wine*' | head
          bin="$(dirname "$(find "$HOME/wine" \( -name wine -o -name wine64 \) -type f | head -1)")"
          test -n "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          echo "WINEPREFIX=$HOME/.wine" >> "$GITHUB_ENV"
          echo "PATH=$bin:$PATH" >> "$GITHUB_ENV"

      - name: Install Mozilla fxc2
        run: |
          set -eux
          curl -fL --retry 5 -o /tmp/fxc2.tar.zst \
            https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/Nf6JL7k5R1aGaTPIOwxEhA/artifacts/public/build/fxc2.tar.zst
          mkdir -p "$HOME/fxc2"
          tar --zstd -xf /tmp/fxc2.tar.zst -C "$HOME/fxc2" --strip-components=1
          find "$HOME/fxc2" -maxdepth 3 -type f
          bin="$HOME/fxc2/bin"
          mv "$bin/fxc2.exe" "$bin/fxc2-real.exe"
          printf '%s\n' '#!/bin/sh' 'export WINEDEBUG=-all' \
            'export WINEDLLOVERRIDES="mscoree,mshtml="' \
            'exec "$(command -v wine || command -v wine64)" "$HOME/fxc2/bin/fxc2-real.exe" "$@"' \
            > "$bin/fxc2.exe"
          chmod +x "$bin/fxc2.exe" "$bin/fxc2-real.exe"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Add Rust Windows target
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain list || true
          rustup target add --toolchain stable-x86_64-unknown-linux-gnu \
            x86_64-pc-windows-gnu x86_64-pc-windows-gnullvm
          rustup target list --toolchain stable-x86_64-unknown-linux-gnu --installed

      - name: Install Windows App SDK
        run: |
          set -eux
          curl -fL --retry 5 -o /tmp/wasdk.zip \
            https://aka.ms/windowsappsdk/2.2/2.2.0/Microsoft.WindowsAppRuntime.Redist.2.2.zip
          mkdir -p "$HOME/wasdk"
          unzip -q /tmp/wasdk.zip -d "$HOME/wasdk"
          dll="$(find "$HOME/wasdk" -name 'Microsoft.WindowsAppRuntime.dll' | head -1)"
          test -n "$dll"
          d="$(dirname "$dll")"
          ls "$d" | head -30
          echo "MOZ_WINDOWS_APP_SDK_DIR=$d" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: src
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: |
          set -eux
          cp ../browser/nullsec-mozconfig-win64 mozconfig
          ./mach configure

      - name: Build
        working-directory: src
        env:
          LLVM_MINGW: /home/runner/llvm-mingw
        run: |
          set -o pipefail
          ./mach build 2>&1 | tee ../build.log

      - name: Show build failure
        if: failure()
        run: |
          echo "::group::last 400 lines of build.log"
          tail -n 400 build.log || true
          echo "::endgroup::"
          df -h /

      - name: Package
        working-directory: src
        run: |
          set -o pipefail
          ./mach package 2>&1 | tee -a ../build.log

      - name: Collect package
        run: |
          set -eux
          mkdir -p out
          find src/obj-nullsec-win64/dist -maxdepth 1 -type f \
            \( -name '*.zip' -o -name '*.tar.xz' -o -name '*.tar.bz2' \) \
            -exec cp -v {} out/ \;
          ls -lah out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-windows64
          path: out/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-browser-windows64-log
          path: |
            build.log
            src/obj-nullsec-win64/config.log
          if-no-files-found: ignore

  release:
    if: ${{ always() && inputs.create_release && (needs.linux64.result == 'success' || needs.windows64.result == 'success') }}
    needs: [linux64, windows64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -eux
          tag="nullsec-$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          find artifacts -type f | sort
          gh release create "$tag" $(find artifacts -type f) \
            --title "NullSec Browser $tag" \
            --notes "Automated build from Mullvad source ${SOURCE_REF}." \
            --target "$GITHUB_SHA"

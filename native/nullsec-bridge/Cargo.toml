[package]
name = "nullsec-bridge"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "NullSec native messaging bridge"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"